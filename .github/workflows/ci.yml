name: CI Pipeline
 
on: 
  pull_request:
   branches:
     - main
  

  push:
   branches:
     - main


jobs:
  quality:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout Code
       uses: actions/checkout@v5

     - name: Setup Node
       uses: actions/checkout@v5
       with:
        node-version: 20
        cache: npm

     - name: Install Packages
       run: npm install

     - name: Run Lint
       run: npm install

     - name: Build App
       run: npm run build