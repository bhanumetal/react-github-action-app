name: React Build

on:
  push:
   branches:
     - main
jobs:
  build:
   runs-on: ubuntu-latest

   steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Install Packages
      run: npm install

    - name: Build React App
      run: npm run build
      
